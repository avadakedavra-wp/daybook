name: my_mini_todo
description: สมุดกิจกรรมส่วนตัวสามรายการสำหรับเวิร์กช็อป Flutter
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: JournalThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
    - family: JournalLatin
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
